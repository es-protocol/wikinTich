name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          NODE_ENV: test
        run: npm test

      - name: Build
        run: npm run build

  # --- Deploy: only on push to `master` (e.g. after merge from dev), and only if CI job above passed.
  # Configure GitHub repo → Settings → Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, EC2_APP_DIR
  # (see docs/DEPLOY_EC2_GITHUB.md). EC2 must have the repo cloned and `.env` (or .env.local) for compose build args.
  deploy-ec2:
    name: Deploy to EC2
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH — pull and Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export GIT_SHA="${{ github.sha }}"
            cd "${{ secrets.EC2_APP_DIR }}"
            git fetch origin
            git checkout master
            git reset --hard origin/master
            docker compose up -d --build

